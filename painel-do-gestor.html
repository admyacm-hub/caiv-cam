<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIVCAM - Painel do Gestor - Login</title>
    <link rel="icon" type="image/jpeg" href="RUID6f3c7ef43d3147a99722ed3b25f6b050.jpeg">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #5a2d82;
            --accent: #d4af37;
            --bg-color: #f9f9f9;
            --text-dark: #333333;
            --white: #ffffff;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lato', sans-serif;
            background: linear-gradient(rgba(90, 45, 130, 0.85), rgba(90, 45, 130, 0.92)), url('https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=1200&q=80') center/cover;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1, h2, h3, .btn {
            font-family: 'Montserrat', sans-serif;
        }

        .login-card {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            border-top: 5px solid var(--accent);
        }

        .login-card img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent);
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(90, 45, 130, 0.2);
        }

        .login-card h2 {
            color: var(--primary);
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .login-card p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: 'Lato', sans-serif;
            font-size: 0.95rem;
            transition: var(--transition);
            background-color: #fdfdfd;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(90, 45, 130, 0.1);
            background-color: var(--white);
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--white);
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            background-color: #4a236d;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-secondary:hover {
            background-color: rgba(90, 45, 130, 0.05);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="RUID6f3c7ef43d3147a99722ed3b25f6b050.jpeg" alt="Logo CAIVCAM">
        <h2>Painel do Gestor</h2>
        <p>Acesso restrito à administração do CAIVCAM</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Utilizador / E-mail</label>
                <div class="input-icon">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="username" placeholder="Digite seu utilizador" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Palavra-passe</label>
                <div class="input-icon">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="Digite sua palavra-passe" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-right-to-bracket"></i> Entrar no Painel
            </button>
        </form>

        <a href="index.html" class="btn btn-secondary">
            <i class="fa-solid fa-arrow-left"></i> Voltar à Página Inicial
        </a>

        <div class="footer-note">
            &copy; 2026 CAIVCAM. Todos os direitos reservados.
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();
            const user = document.getElementById('username').value;
            // Exemplo de simulação de login
            alert('Autenticação simulada com sucesso para: ' + user);
            // Aqui você pode redirecionar para a interface interna do painel se houver
        }
    </script>
</body>
</html>
