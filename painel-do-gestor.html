<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAIVCAM - Painel de Administração</title>
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/admyacm-hub/caiv-cam/main/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* ... (seu CSS existente + melhorias) ... */
        
        /* Animações */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        /* Modo escuro */
        body.dark-mode {
            --primary-purple: #3f1e5a;
            --bg-light: #1a1a1a;
            --text-dark: #f0f0f0;
            --white: #2d2d2d;
            --gray-border: #444;
        }
        
        /* Badge de notificações */
        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #d9534f;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- ... (seu HTML existente + melhorias) ... -->
    
    <script>
        // Código JavaScript melhorado com todas as funcionalidades
        
        // Inicialização
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            loadAuditLog();
            checkSession();
            applyDarkModePreference();
        });
        
        // ... (todas as funções melhoradas) ...
    </script>
</body>
</html>
